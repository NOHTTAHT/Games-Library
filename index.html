<!doctype html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Games Library</title>
<link rel="icon" href="icon.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Games Library">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky header, one scrolling column of views, fixed bottom tab bar; game cards wear a case-style platform band on top */
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --surface-2:#F5F6F9; --ink:#13151B; --muted:#5D6371; --line:#D8DBE2;
  --accent:#F25418; --accent-ink:#FFFFFF;
  --ps:#1F5FE0; --ns1:#E3000F; --ns2:#E3000F;
  --ok:#1C8C4E; --ok-bg:#E3F4EA; --warn:#B45309; --warn-bg:#FDF0DC; --danger:#C62828;
  --shadow:0 1px 2px rgba(19,21,27,.06),0 4px 14px rgba(19,21,27,.05);
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --tabbar-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F14; --surface:#171A21; --surface-2:#1E222A; --ink:#ECEEF3; --muted:#9BA2B1; --line:#2B303B;
  --accent:#FF7440; --accent-ink:#1A0A03;
  --ps:#5A8BFF; --ns1:#FF4A55; --ns2:#FF4A55;
  --ok:#46CC84; --ok-bg:#15301F; --warn:#F2A33A; --warn-bg:#33240E; --danger:#FF6B6B;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F14; --surface:#171A21; --surface-2:#1E222A; --ink:#ECEEF3; --muted:#9BA2B1; --line:#2B303B;
  --accent:#FF7440; --accent-ink:#1A0A03;
  --ps:#5A8BFF; --ns1:#FF4A55; --ns2:#FF4A55;
  --ok:#46CC84; --ok-bg:#15301F; --warn:#F2A33A; --warn-bg:#33240E; --danger:#FF6B6B;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--vt-offset,0px));z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-left:auto}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--ok)} .sync.local i{background:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500;cursor:pointer;min-height:40px;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent}
.btn.small{min-height:32px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn[disabled]{opacity:.5;pointer-events:none}

main{padding-bottom:calc(var(--tabbar-h) + var(--vb-offset,0px) + env(safe-area-inset-bottom,0px) + 24px)}
section.view{padding-block:16px;display:flex;flex-direction:column;gap:14px}
h2.vt{font-family:var(--f-display);font-weight:700;font-size:26px;margin:4px 0 0;text-wrap:balance;letter-spacing:-.01em}
h3.st{font-family:var(--f-display);font-weight:600;font-size:17px;margin:8px 0 0}
.sub{color:var(--muted);font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:42px}
.search input{border:0;background:transparent;outline:0;width:100%;min-width:0;padding:8px 0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap;min-height:34px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:42px;font-size:14px}

.statline{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.statline b{color:var(--ink);font-weight:600}

/* Game cards: case-style top band in the platform colour */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--shadow);text-align:left;padding:0;width:100%}
.band{display:flex;align-items:center;justify-content:space-between;padding:4px 12px;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;color:#fff}
.band.PS5{background:var(--ps)} .band.NS1{background:#fff;color:var(--ns1);box-shadow:inset 0 -2px 0 var(--ns1)} .band.NS2{background:var(--ns2)}
.band span:last-child{font-family:var(--f-body);font-weight:500;letter-spacing:0;opacity:.95}
.card .body{padding:10px 12px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;min-width:0}
.card .title{font-weight:600;font-size:16px;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.card .price{font-family:var(--f-mono);font-weight:600;font-size:15px;text-align:right}
.card .body.hc{grid-template-columns:52px 1fr auto}
.thumb{grid-row:1/span 3;width:52px;aspect-ratio:3/4.2;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:var(--surface-2)}
.card .body.hc .who,.card .body.hc .meta{grid-column:2/-1}
.card .who{grid-column:1/-1;color:var(--muted);font-size:13px;min-width:0;overflow-wrap:anywhere}
.card .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--muted)}
@media (max-width:600px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .band{padding:2px 6px;font-size:10px;letter-spacing:.02em}
  .band span:last-child{font-size:10px}
  .card{border-radius:10px}
  .card .body.hc{grid-template-columns:minmax(0,1fr) auto;padding:0 0 10px;gap:4px 6px;align-content:start}
  .card .body.hc>.thumb,.card .body.hc>.rthumb{grid-row:auto;grid-column:1/-1;width:100%;flex:none;aspect-ratio:3/4;border-radius:0;border:0;border-bottom:1px solid var(--line)}
  .card .body.hc>.rthumb span{font-size:34px}
  .card .title{grid-column:1/-1;padding:4px 6px 0;font-size:12.5px;line-height:1.3;min-height:calc(2.6em + 4px);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .price{grid-column:1/-1;text-align:left;padding:0 6px;font-size:12px}
  .card .body.hc .who{display:none}
  .card .body.hc .meta{grid-column:1/-1;padding:0 6px;margin-top:2px;gap:3px;align-self:end}
  .card .body.hc{flex:1;grid-template-rows:auto auto auto 1fr}
  .card .body.hc .meta .pill.soft{display:none}
  .card .body.hc .meta>span:last-child{display:none}
  .card .meta .pill{font-size:10.5px;padding:1px 6px}
  .card .body.hc{padding-bottom:8px}
}
.linkbtn{background:none;border:0;padding:0 2px;color:var(--accent,#E8590C);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.spr{display:block;width:100%;height:100%;background-repeat:no-repeat;background-color:var(--surface-2)}
.thumb.spr{height:auto}
.cover .spr{flex:1;height:auto}
.pill.fmt{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)} .pill.fmt.dl{border-style:dashed}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.soft{background:var(--surface-2);color:var(--muted);font-weight:500;border:1px solid var(--line)}
.ptag{display:inline-block;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:700;font-family:var(--f-display);letter-spacing:.04em;color:#fff}
.ptag.PS5{background:var(--ps)} .ptag.NS1{background:#fff;color:var(--ns1);box-shadow:inset 0 0 0 1.5px var(--ns1)} .ptag.NS2{background:var(--ns2)}
.n2{margin-left:.2em;font-weight:800;color:inherit}
.detail-top{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:start}
@media (min-width:520px){.detail-top{grid-template-columns:170px 1fr}}
.cover{aspect-ratio:3/4.2;max-width:100%;border-radius:8px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;font-family:var(--f-display);font-weight:600;font-size:14px;line-height:1.25;color:var(--muted);overflow-wrap:anywhere}
.cover .cb{padding:3px 8px;font-family:var(--f-display);font-weight:700;font-size:11px;color:#fff;letter-spacing:.05em}
.cover .cb.PS5{background:var(--ps)} .cover .cb.NS2{background:var(--ns1)} .cover .cb.NS1{background:#fff;color:var(--ns1);box-shadow:inset 0 -2px 0 var(--ns1)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;min-width:0;overflow-wrap:anywhere;font-weight:500}
.dtitle{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.25;margin:0 0 6px;text-wrap:balance;overflow-wrap:anywhere}
.vids{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vid{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px;text-decoration:none;color:var(--ink);background:var(--surface-2)}
.vid .play{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.vid b{display:block;font-size:14px} .vid span{font-size:12px;color:var(--muted)}
.rthumb{width:46px;flex:0 0 46px;aspect-ratio:3/4.2;border-radius:5px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column}
.rthumb img{width:100%;height:100%;object-fit:cover;display:block}
.rthumb i{height:5px;flex:0 0 5px} .rthumb i.PS5{background:var(--ps)} .rthumb i.NS1,.rthumb i.NS2{background:var(--ns1)}
.rthumb span{flex:1;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--muted)}
.thumb.ph{display:flex;flex-direction:column;overflow:hidden}
.row.click{cursor:pointer}
.row.click:hover{background:var(--surface-2)}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lightbox .lbx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:20px;padding:8px 14px;font-weight:600}
.lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:20px}
.rt{cursor:pointer;text-align:left;background:none;border:0;padding:0;font:inherit;color:inherit}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:18px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}

/* Lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:11px 12px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{color:var(--muted);font-size:13px}
.day{width:44px;flex:0 0 44px;text-align:center;font-family:var(--f-mono);font-weight:600;font-size:20px;line-height:1}
.day.d3{font-size:18px}
.day small{display:block;font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--muted);margin-top:3px}
.month-h{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--vt-offset,0px) + var(--head-h,115px));z-index:5;background:var(--bg);padding:8px 0 6px;font-family:var(--f-display);font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.month-h span{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.heart[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}

.person{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.person > header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;flex:0 0 32px}

/* Summary */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font-family:var(--f-mono);font-weight:600;font-size:clamp(17px,4.6vw,24px);line-height:1.2;margin-top:2px;overflow-wrap:anywhere}
.kpi.hero{grid-column:1/-1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.hero .eyebrow{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.kpi.hero .v{font-size:36px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.bar{display:grid;grid-template-columns:minmax(70px,30%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;border-radius:5px;background:var(--ink)}
.bar .fill.PS5{background:var(--ps)} .bar .fill.NS1{background:var(--ns1)} .bar .fill.NS2{background:repeating-linear-gradient(135deg,var(--ns2) 0 6px,color-mix(in srgb,var(--ns2) 70%,var(--surface)) 6px 9px)}
.bar .val{font-family:var(--f-mono);font-size:12.5px;text-align:right}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:var(--vb-offset,0px);z-index:25;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);transition:bottom .12s ease-out}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar-h)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500;position:relative}
nav.tabs a svg{width:23px;height:23px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs a .badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;min-width:16px;text-align:center;line-height:16px}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,10,14,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px;max-height:90%}}
.sheet.tall{height:calc(100% - env(safe-area-inset-top,0px) - 24px)}.sheet.tall .content{flex:1 1 auto}
@media (min-width:700px){.sheet.tall{height:90%}}
.sheet > header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet > header h3{margin:0;font-family:var(--f-display);font-size:19px;flex:1;min-width:0}
.sheet .content{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.sheet > footer{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex-wrap:wrap}
.sheet > footer .sp{flex:1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label,.field > .lab{font-size:13px;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two > *{min-width:0}
.field input[type="date"]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-width:0;text-align:left;line-height:1.3}
.field input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0}
.field input[type="date"]::-webkit-calendar-picker-indicator{margin-left:auto}
@media (max-width:480px){.two.stack{grid-template-columns:minmax(0,1fr)}}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 6px;font-weight:500;cursor:pointer;min-height:38px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:600}
.seg button[aria-pressed="true"][data-v="PS5"]{background:var(--ps);color:#fff}
.seg button[aria-pressed="true"][data-v="NS1"]{background:#fff;color:var(--ns1);box-shadow:inset 0 0 0 2px var(--ns1)}

/* Re-render around a focused input without replacing it, so typing and the iOS keyboard are not interrupted */
function patchApp(app, html, ae){
  const tpl=document.createElement("template"); tpl.innerHTML=html.trim();
  const newSec=tpl.content.firstElementChild, oldSec=app.firstElementChild;
  if(!newSec || !oldSec || newSec.tagName!==oldSec.tagName){ app.innerHTML=html; return; }
  const keepOld=[...oldSec.children].find(c=>c.contains(ae));
  const keepNew=[...newSec.children].find(c=>c.querySelector("#"+CSS.escape(ae.id)));
  if(!keepOld || !keepNew){ app.innerHTML=html; return; }
  const kids=[...newSec.children]; const i=kids.indexOf(keepNew);
  [...oldSec.children].forEach(c=>{ if(c!==keepOld) c.remove(); });
  kids.slice(0,i).forEach(n=>oldSec.insertBefore(n,keepOld));
  kids.slice(i+1).forEach(n=>oldSec.appendChild(n));
  // refresh the kept block's other controls (chips, selects) but leave the focused input alone
  [...keepNew.querySelectorAll("[aria-pressed]")].forEach(n=>{ const o=keepOld.querySelector(`[data-chip="${n.dataset.chip}"][data-v="${n.dataset.v}"]`); if(o) o.setAttribute("aria-pressed",n.getAttribute("aria-pressed")); });
}

function genreOptions(values){
  const m=new Map(); values.forEach(v=>splitGenres(v).forEach(x=>{ const k=genreKey(x); const e=m.get(k)||{label:x.charAt(0).toUpperCase()+x.slice(1),n:0}; e.n++; m.set(k,e); }));
  return [...m.entries()].sort((a,b)=>b[1].n-a[1].n).map(([k,e])=>({k,label:e.label,n:e.n}));
}

function findOwnedMatch(title, platforms){
  const t=norm(title);
  return S.games.filter(g=>norm(g.title)===t && (!platforms || platforms.includes(g.platform)));
}

function allReleases(){
  if(S.relCache) return S.relCache;
  const m=new Map();
  const add=r=>{ if(!r||!r.t||!r.d||!Array.isArray(r.p)) return; const k=norm(r.t)+"|"+r.d; const ex=m.get(k);
    if(ex){ ex.p=[...new Set([...ex.p,...r.p])]; ["dev","pub","c"].forEach(f=>{ if(!ex[f]&&r[f]) ex[f]=r[f]; }); } else m.set(k,{...r,p:[...r.p]}); };
  S.catalog.forEach(add); ((S.releases?.items)||[]).forEach(add);
  S.relCache=[...m.values()]; S.relCache.forEach(r=>{ r._n=norm(r.t); r._q=norm(r.t+" "+(r.dev||"")+" "+(r.pub||"")); }); S.coverMap=new Map(); S.genreMap=new Map(); S.relCache.forEach(r=>{ const n=norm(r.t); if(r.c) S.coverMap.set(n,r.c); if(r.g){ r.p.forEach(p=>S.genreMap.set(n+"|"+p,r.g)); if(!S.genreMap.has(n)) S.genreMap.set(n,r.g); } }); return S.relCache;
}
function viewReleases(){
  const R=S.rel; const items=allReleases(); const t=today();
  if(!items.length){
    return `<section class="view">${planTabs("releases")}<div class="empty"><b>ยังไม่มีข้อมูลกำหนดการ</b><span>ระบบจะดึงข้อมูลใหม่ให้เองทุกวันเวลา 12:00 น.</span></div></section>`;
  }
  const pastYears=[...new Set(items.filter(r=>r.d<t&&(R.plat==="all"||r.p.includes(R.plat))).map(r=>r.d.slice(0,4)))].sort().reverse();
  if(R.when==="past" && (!R.year || (R.year!=="all" && !pastYears.includes(R.year)))) R.year="all";
  const qn=norm(R.q);
  let list=items.filter(r=>{
    if(R.plat!=="all" && !r.p.includes(R.plat)) return false;
    if(R.genre && !hasGenre(r.g||infoOf(r.t)?.genre,R.genre)) return false;
    if(R.q){ if(!r._q.includes(qn)) return false; }
    if(R.when==="upcoming") return r.d>=t;
    if(r.d>=t) return false;
    return (R.q || R.year==="all") ? true : r.d.startsWith(R.year);
  });
  list.sort((a,b)=> R.when==="upcoming" ? a.d.localeCompare(b.d) : b.d.localeCompare(a.d));
  const total=list.length; const lim=R.limit||150; const shown=list.slice(0,lim);
  const groups=[]; let cur=null;
  shown.forEach(r=>{ const k=r.d.slice(0,7); if(!cur||cur.k!==k){ cur={k,items:[]}; groups.push(cur);} cur.items.push(r); });
  const rowHtml = r => {
    const mine=findOwnedMatch(r.t, r.p);
    const has=mine.find(g=>g.status!=="wishlist"); const wish=mine.find(g=>g.status==="wishlist");
    const d=new Date(r.d+"T00:00:00");

    const cov=r.c||infoOf(r.t)?.coverId||coverOf(r.t,has||wish)||"";
    return `<div class="row click" data-reldetail="${esc(r.t)}|${r.d}|${r.p.join(",")}"><div class="day">${d.getDate()}<small>${wd}</small></div>${thumbHTML(r.t,r.p[0],cov,"rthumb")}
      <div class="grow"><div class="t">${esc(r.t)}</div><div class="s" style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:2px">${r.ps4?PS4TAG:r.p.map(platTag).join("")}${r.pub||r.dev?` <span>${esc(r.pub||r.dev)}</span>`:""}${r.g?` <span>· ${esc(splitGenres(r.g).slice(0,2).join(", "))}</span>`:""}${has?` <span class="pill ok">มีแล้ว</span>`:""}${rentTag(r.t)}</div></div>
      <div class="rowbtns">
        <button class="btn small heart" data-wish="${esc(r.t)}|${r.d}|${r.p.join(",")}" aria-pressed="${!!wish}" aria-label="Wishlist">${wish?"♥":"♡"}</button>
        ${r.d<=today()?rentBtn(r.t,"rentrel",`${r.t}|${r.d}|${r.p.join(",")}`,"btn small"):""}<button class="btn small" data-bought="${esc(r.t)}|${r.d}|${r.p.join(",")}">ซื้อ</button>
      </div></div>`;
  };
  return `<section class="view">
    ${planTabs("releases")}
    <div class="seg" role="group" style="width:100%">
      <button type="button" data-relwhen="upcoming" aria-pressed="${R.when==="upcoming"}">กำลังจะออก</button>
      <button type="button" data-relwhen="past" aria-pressed="${R.when==="past"}">ออกแล้ว</button>
    </div>
    <div class="tools"><label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="relQ" type="search" placeholder="ค้นหาเกม" value="${esc(R.q)}"></label>${genreSelect("relGenre",S.relGenreOpts||(S.relGenreOpts=genreOptions(items.map(r=>r.g||infoOf(r.t)?.genre||""))),R.genre,60)}</div>
    ${chipRow("relPlat",[["all","ทุกเครื่อง"],["PS5","PS5"],["NS2",platLabel("NS2")],["NS1","Switch 1"]],R.plat)}
    ${R.when==="past"&&!R.q&&pastYears.length>1?chipRow("relYear",[["all","ทุกปี"],...pastYears.map(y=>[y,y])],R.year):""}
    <div class="statline"><span><b>${total.toLocaleString()}</b> เกม${total>shown.length?` (แสดง ${shown.length})`:""}${R.when==="past"&&!R.q&&R.year!=="all"?` ในปี ${esc(R.year)}`:""}</span></div>
    ${groups.length? (groups.length>1?`<div class="tools" style="justify-content:flex-end;margin-bottom:-6px"><button type="button" class="btn small ghost" data-relfoldall="${groups.every(g=>relFolded(R.when,g.k))?"0":"1"}" data-relkeys="${groups.map(g=>g.k).join(",")}">${groups.every(g=>relFolded(R.when,g.k))?"แสดงทุกเดือน":"ซ่อนทุกเดือน"}</button></div>`:"") + groups.map(g=>{ const f=relFolded(R.when,g.k); return `<div><button type="button" class="month-h mfold" data-relfold="${g.k}" aria-expanded="${!f}">${monthName(g.k+"-01")}<span>${g.items.length} เกม<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></span></button>${f?"":`<div class="list">${g.items.map(rowHtml).join("")}</div>`}</div>`; }).join("") + (total>shown.length?`<button class="btn" style="width:100%;margin-top:12px" data-act="relMore">แสดงเพิ่มอีก ${Math.min(150,total-shown.length)} เกม</button>`:"") : `<div class="empty"><b>ไม่พบเกมในช่วงนี้</b></div>`}

    <p class="src">ข้อมูลวันวางจำหน่ายรวบรวมจาก ${esc(S.releases.source||"เว็บข่าวเกม")} · อัปเดต ${fmtDate(S.releases.updatedAt)} · วันวางขายอาจเปลี่ยนตามผู้จัดจำหน่าย</p>
  </section>`;
}

function bars(rows, cls){
  const max=Math.max(1,...rows.map(r=>r.v));
  return rows.map(r=>`<div class="bar"><span class="lbl">${r.label}</span><span class="track"><span class="fill ${cls?cls(r):""}" style="width:${Math.max(2,r.v/max*100)}%;display:block"></span></span><span class="val">${baht(r.v)}<span class="sub"> · ${r.n}</span></span></div>`).join("");
}
function groupSum(list, keyFn){
  const m={}; list.forEach(g=>{ const k=keyFn(g); if(!m[k]) m[k]={k,v:0,n:0}; m[k].v+=(+g.price||0); m[k].n++; }); return Object.values(m);
}

/* ---------- storage (cover images only) ---------- */
function fmtMB(b){ return (b/1048576).toLocaleString("th-TH",{maximumFractionDigits:0})+" MB"; }
function assetIdOf(c){ c=String(c||""); if(c.startsWith("sp:")) return c.split(":")[1]||""; return /^[0-9a-f]{32}$/.test(c)?c:""; }
function coverIdsInUse(){
  const keep=new Set(); const add=c=>{ const id=assetIdOf(c); if(id) keep.add(id); };
  S.games.forEach(g=>add(g.coverId)); Object.values(S.info||{}).forEach(i=>add(i&&i.coverId));
  (S.catalog||[]).forEach(r=>add(r.c)); ((S.releases&&S.releases.items)||[]).forEach(r=>add(r.c));
  return keep;
}
function storagePanel(){
  if(!ASSETS || !ASSETS.list || S.mode!=="cloud") return "";

  if(!st.usage && !st.loading){ st.loading=true; ASSETS.list().then(r=>{ st.usage=r.usage; st.loading=false; render(); }).catch(()=>{ st.loading=false; st.msg="อ่านข้อมูลพื้นที่ไม่สำเร็จ"; render(); }); }
  const u=st.usage; const pct=u?Math.round(u.files/u.maxFiles*100):0;
  return `<h3 class="st">พื้นที่เก็บรูป</h3>
    <div class="panel">
      ${u?`<div class="bar"><span class="lbl">จำนวนไฟล์</span><span class="track"><span class="fill" style="display:block;width:${pct}%"></span></span><span class="mono">${u.files.toLocaleString()} / ${u.maxFiles.toLocaleString()}</span></div>
      <div class="bar"><span class="lbl">ขนาด</span><span class="track"><span class="fill" style="display:block;width:${Math.round(u.bytes/u.maxBytes*100)}%"></span></span><span class="mono">${fmtMB(u.bytes)} / ${fmtMB(u.maxBytes)}</span></div>`:`<div class="sub">กำลังอ่านข้อมูลพื้นที่…</div>`}
      <div class="sub">แอปเก็บเฉพาะรูปปกเกมแล้ว ปุ่มด้านล่างจะลบภาพตัวอย่างทั้งหมดและไฟล์รูปที่ไม่มีเกมไหนใช้ รูปปกที่ใช้อยู่ไม่ถูกลบ</div>

async function cleanStorage(){
  const st=S.storage; st.confirm=false; st.running=true; st.msg="กำลังตรวจไฟล์…"; render();
  try{
    if(!(S.catalog||[]).length || !S.loaded) throw new Error("ข้อมูลยังโหลดไม่ครบ ลองใหม่อีกครั้ง");
    // 1) remove screenshot references from the database
    let docs=0;
    for(const [k,info] of Object.entries(S.info||{})){ if(info && "shots" in info){ const d={...info}; delete d.shots; await DB.collection("gameinfo").doc(k).set(JSON.parse(JSON.stringify(d))); docs++; } }
    for(const [k,data] of Object.entries(S.catalogDocs||{})){
      const items=data.items||[]; if(!items.some(r=>r&&r.s)) continue;
      await DB.collection("catalog").doc(k).set({...data, items:items.map(r=>{ if(!r||!r.s) return r; const c={...r}; delete c.s; return c; })}); docs++;
    }
    if(S.releases && (S.releases.items||[]).some(r=>r&&r.s)){ await DB.doc("meta/releases").set({...S.releases, items:S.releases.items.map(r=>{ if(!r||!r.s) return r; const c={...r}; delete c.s; return c; })}); docs++; }
    // 2) delete every asset that is not a cover in use (files added in the last 3 hours are kept, in case an upload is still being recorded)
    const keep=coverIdsInUse(); if(keep.size<10) throw new Error("ไม่พบรายการรูปปก หยุดไว้ก่อนเพื่อความปลอดภัย");
    const r=await ASSETS.list(); const recent=Date.now()-3*3600e3;
    const del=r.assets.filter(a=>!keep.has(a.id) && !(Date.parse(a.createdAt)>recent));
    let n=0, fail=0; const q=[...del];
    const worker=async()=>{ while(q.length){ const a=q.shift(); try{ await ASSETS.delete(a.id); n++; }catch{ fail++; } if((n+fail)%25===0){ st.msg=`ลบแล้ว ${n.toLocaleString()} จาก ${del.length.toLocaleString()} ไฟล์`; render(); } } };
    await Promise.all([worker(),worker(),worker(),worker()]);
    const after=await ASSETS.list(); st.usage=after.usage;
    st.msg=`เสร็จแล้ว ลบ ${n.toLocaleString()} ไฟล์${fail?` (ลบไม่สำเร็จ ${fail} ไฟล์ กดอีกครั้งได้)`:""} · เหลือ ${after.usage.files.toLocaleString()} ไฟล์`;
  }catch(e){ st.msg = e && e.message ? e.message : "ล้างไม่สำเร็จ ลองใหม่อีกครั้ง"; }
  st.running=false; render();
}

function addMonthsISO(iso,n){ const [y,m,d]=iso.split("-").map(Number); const t=new Date(y,m-1+n,1); const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(); t.setDate(Math.min(d,last)); return isoOf(t); }
function addDaysISO(iso,n){ const [y,m,d]=iso.split("-").map(Number); return isoOf(new Date(y,m-1,d+n)); }
function isoOf(t){ return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); }
function subEnd(s){
  if(!s.start||!/^\d{4}-\d{2}-\d{2}$/.test(s.start)) return "";
  const m=+s.months||1;
  return SUB_SERVICES[s.service]?.unit==="day" ? addDaysISO(s.start, m===12?365:m*30) : addMonthsISO(s.start,m);
}
function subStep(s,iso,dir){ const n=+s.months||1; return SUB_SERVICES[s.service]?.unit==="day" ? addDaysISO(iso, dir*(n===12?365:n*30)) : addMonthsISO(iso, dir*n); }
/* With auto-renew on, roll the period forward until it covers today */
function subNextEnd(s){
  let end=subEnd(s); if(!end||!s.autoRenew) return end; const t=today(); let guard=0;
  while(end<t && guard++<500) end=subStep(s,end,1);
  return end;
}
function subStatus(s){
  const t=today(); const end=subNextEnd(s); if(!end) return {k:"none",end:""};
  if(s.start>t) return {k:"future",end,left:daysBetween(t,end),startsIn:daysBetween(t,s.start)};
  const from = end===subEnd(s) ? s.start : subStep(s,end,-1);
  const left=daysBetween(t,end); const total=Math.max(1,daysBetween(from,end));
  if(left<0) return {k:"expired",end,left};
  return {k:left<=7?"bad":left<=30?"warn":"ok",end,left,total};
}

/* The entry that matters most per service: the active one ending last, else the next queued, else the latest expired */
function subCurrent(service){
  const list=S.subs.filter(s=>s.service===service).map(s=>({s,st:subStatus(s)}));
  const active=list.filter(x=>["ok","warn","bad"].includes(x.st.k)).sort((a,b)=>b.st.end.localeCompare(a.st.end));
  const future=list.filter(x=>x.st.k==="future").sort((a,b)=>b.st.end.localeCompare(a.st.end));
  const exp=list.filter(x=>x.st.k==="expired").sort((a,b)=>b.st.end.localeCompare(a.st.end));
  return { main: active[0]||future[0]||exp[0]||null, queued: active.length? future : future.slice(1), coverEnd: [...active,...future].map(x=>x.st.end).sort().pop()||"" };
}

async function subClick(t){
  const ds=t.dataset;
  if(ds.subnew){ openSubSheet({service:ds.subnew, plan:SUB_SERVICES[ds.subnew].plans[0].id, months:12}); return true; }
  if(ds.subpick){ const [service,plan,m]=ds.subpick.split("|"); openSubSheet({service,plan,months:+m}); return true; }
  if(ds.subedit){ const s=S.subs.find(x=>x.id===ds.subedit); if(s) openSubSheet(s); return true; }
  if(ds.subrenew){ const s=S.subs.find(x=>x.id===ds.subrenew); if(s){ const st=subStatus(s); const c=subCurrent(s.service); const from=c.coverEnd&&c.coverEnd>=today()?c.coverEnd:today();
      openSubSheet({service:s.service, plan:s.plan, months:s.months, autoRenew:false, start: st.k==="expired"?today():from,
        share:s.share||"none", owner:s.owner||"", myShare:s.myShare??"", members:(s.members||[]).map(m=>({name:m.name||"",amount:m.amount??"",paid:false}))}); } return true; }
  const sh=S.subSheet; if(!sh) return false; const d=sh.draft;
  if(ds.subseg){ pullSubForm();
    if(ds.subseg==="service"){ d.service=ds.v; d.plan=SUB_SERVICES[ds.v].plans[0].id; fixSubDraft(d); }
    else if(ds.subseg==="plan"){ d.plan=ds.v; fixSubDraft(d); }
    else if(ds.subseg==="months"){ d.months=+ds.v; fixSubDraft(d); }
    else if(ds.subseg==="autoRenew"){ d.autoRenew=ds.v==="1"; }
    else if(ds.subseg==="share"){ d.share=ds.v; if(ds.v==="host" && !(d.members||[]).length) d.members=[{name:"",amount:"",paid:false}]; }
    renderSubSheet(); return true; }
  if(ds.subpaid!=null){ pullSubForm(); const m=d.members[+ds.subpaid]; if(m) m.paid=!m.paid; renderSubSheet(); return true; }
  if(ds.subrm!=null){ pullSubForm(); d.members.splice(+ds.subrm,1); renderSubSheet(); return true; }
  switch(ds.act){
    case "subAddMember": pullSubForm(); d.members=[...(d.members||[]),{name:"",amount:"",paid:false}]; renderSubSheet(); setTimeout(()=>$("#sm-name-"+(d.members.length-1))?.focus(),30); return true;
    case "subSplit": pullSubForm(); { const n=d.members.length+1; const each=Math.round((+d.price||0)/n*100)/100; d.members.forEach(m=>m.amount=each); } renderSubSheet(); return true;
    case "subClose": closeSheet(); return true;
    case "subChain": pullSubForm(); d.start=ds.v; renderSubSheet(); return true;
    case "subSave": pullSubForm();
      if(d.share!=="host") d.members=[]; else d.members=(d.members||[]).filter(m=>m.name||m.amount);
      if(d.share!=="member"){ d.owner=""; d.myShare=""; }
      if(!/^\d{4}-\d{2}-\d{2}$/.test(d.start||"")){ toast("ใส่วันที่ซื้อก่อน"); $("#sf-start")?.focus(); return true; }
      t.disabled=true; try{ await saveSub(d); closeSheet(); toast(`บันทึกแล้ว หมดอายุ ${fmtDate(subEnd(d))}`); }catch{ t.disabled=false; } return true;
    case "subDelete": pullSubForm(); sh.confirmDelete=true; renderSubSheet(); return true;
    case "subNoDelete": sh.confirmDelete=false; renderSubSheet(); return true;
    case "subReallyDelete": t.disabled=true; try{ await deleteSub(d.id); closeSheet(); toast("ลบแล้ว"); }catch{ t.disabled=false; toast("ลบไม่สำเร็จ ลองอีกครั้ง"); } return true;
  }
  return false;
}

  if(!r.due) return {k:"open", n:r.start?daysBetween(r.start,t):0};

  const sh=S.rentSheet; if(!sh) return false; const d=sh.draft;

/* ---------- background jobs (run by Claude as scheduled tasks) ---------- */
function jobKey(kind,title){ return title ? kind+"_"+infoKey(title) : kind; }
function jobRecent(kind,title){
  const j=S.jobs[jobKey(kind,title)]; if(!j||!j.at) return null;
  const mins=(Date.now()-new Date(j.at).getTime())/60000;
  return mins < JOBS[kind].mins*1.5 ? j : null;
}
function timeAgo(iso){ const m=Math.round((Date.now()-new Date(iso).getTime())/60000); return m<1?"เมื่อสักครู่":m<60?`${m} นาทีที่แล้ว`:m<1440?`${Math.round(m/60)} ชั่วโมงที่แล้ว`:fmtDate(iso.slice(0,10)); }
async function fireJob(kind, title, plats){
  if(!MCP||S.jobBusy||!JOBS[kind]||!JOBS[kind].id) return;
  S.jobBusy=jobKey(kind,title); render();
  try{
    const now=new Date().toISOString();
    const next=JSON.parse(JSON.stringify(S.jobs||{}));
    if(kind==="images" && title){
      const q=(next.imageQueue||[]).filter(e=>e.infoKey!==infoKey(title));
      q.push({title, infoKey:infoKey(title), platforms:plats||[], at:now});
      next.imageQueue=q.slice(-20);
      await DB.doc("meta/jobs").set(next);
    }
    await MCP.callTool("Claude Code Remote","fire_trigger",{trigger_id:JOBS[kind].id},{cache:false});
    next[jobKey(kind,title)]={at:now};
    S.jobs=next; try{ await DB.doc("meta/jobs").set(next); }catch{}
    toast(kind==="sync"||kind==="top10"?"สั่งอัปเดตแล้ว ข้อมูลจะเปลี่ยนเองเมื่อเสร็จ":"สั่งหารูปแล้ว รูปจะขึ้นเองเมื่อเสร็จ");
  }catch(e){
    const c=e&&e.code;
    toast(c==="server_not_connected"||c==="server_not_found"?"ต้องเปิดการเชื่อมต่อ Claude Code Remote ในการตั้งค่า claude.ai ก่อน":
          c==="consent_required"||c==="not_granted"?"ต้องกดอนุญาตให้แอพสั่งงาน Claude ก่อน":
          c==="rate_limited"?"สั่งถี่เกินไป ลองใหม่ภายหลัง":"สั่งงานไม่สำเร็จ ลองใหม่อีกครั้ง");
  }
  S.jobBusy=""; render();
}
function jobButton(kind,title,plats,label){
  if(!MCP || !JOBS[kind] || !JOBS[kind].id) return "";
  const rec=jobRecent(kind,title); const busy=S.jobBusy===jobKey(kind,title);
  const attr=title?` data-jobtitle="${esc(title)}" data-jobplats="${esc((plats||[]).join(","))}"`:"";
  return `<button class="btn small" data-job="${kind}"${attr} ${rec||busy?"disabled":""}>${busy?"กำลังสั่ง…":rec?"กำลังทำงานอยู่…":label}</button>
    <span class="hint">${rec?`สั่งไปเมื่อ ${timeAgo(rec.at)} ใช้เวลาราว ${JOBS[kind].mins} นาที ข้อมูลจะขึ้นเองเมื่อเสร็จ`:`ทำงานเบื้องหลังราว ${JOBS[kind].mins} นาที ปิดแอพได้`}</span>`;

/* ---------- game detail ---------- */
function infoKey(title){
  const k=norm(title).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,120);
  if(k) return k;
  let h=0; for(const c of String(title)) h=(h*31+c.codePointAt(0))>>>0; return "t"+h.toString(36);
}
function infoOf(title){ return S.info[infoKey(title)] || null; }
function coverOf(title,g){ return (g&&g.coverId) || infoOf(title)?.coverId || (g ? (allReleases(), S.coverMap.get(norm(title))||"") : ""); }
/* Cover image: a plain asset id, or "sp:<assetId>:<index>[:<cols>:<rows>]" = one cell of a cover sprite sheet (default 8x8) */
const BLOB = id => window.GL_BACKEND ? window.GL_BACKEND.blobUrl(id) : "";
function coverHTML(cov, cls, alt){
  cov=String(cov||"");
  if(cov.startsWith("sp:")){
    const [,id,i,c,r]=cov.split(":"); const cols=+c||8, rows=+r||8, n=+i||0;
    const x=cols>1?(n%cols)/(cols-1)*100:0, y=rows>1?Math.floor(n/cols)/(rows-1)*100:0;
    return `<span class="spr ${cls||""}" role="img" aria-label="${esc(alt||"")}" style="background-image:url(${esc(BLOB(id))});background-size:${cols*100}% ${rows*100}%;background-position:${x.toFixed(4)}% ${y.toFixed(4)}%"></span>`;
  }
  return `<img${cls?` class="${cls}"`:""} src="${esc(BLOB(cov))}" alt="${esc(alt||"")}" loading="lazy">`;
}
function thumbHTML(title,plat,cov,cls){
  if(cov) return `<span class="${cls}">${coverHTML(cov,"","")}</span>`;
  const ch=(String(title).replace(/^(the|a)\s+/i,"").match(/[A-Za-z0-9ก-๙]/)||["?"])[0].toUpperCase();
  return `<span class="${cls}"><i class="${esc(plat)}"></i><span>${esc(ch)}</span></span>`;
}

async function saveInfo(title, patch){
  const key=infoKey(title); const cur=S.info[key]||{};
  const doc=Object.assign({}, cur, patch, {title, updatedAt:new Date().toISOString()});
  S.info[key]=doc;
  if(S.mode==="cloud") await DB.collection("gameinfo").doc(key).set(JSON.parse(JSON.stringify(doc)));
}

async function detailAi(){
  const x=detailData(); if(!x||!SAMPLE) return; const D=S.detail;
  D.aiState="busy"; renderDetail();
  const prompt=`You are filling a personal video game catalogue for a Thai player. Game: "${x.title}" on ${x.plats.map(p=>PLAT_LONG[p]).join(", ")}.
Reply with only a JSON object:
{"developer": studio name, "publisher": publisher name, "genre": 1-3 genres in English, comma separated (e.g. "Action role-playing, Open world"), "summary": 2-3 sentence description of the game in Thai, "releaseDate": "YYYY-MM-DD" first release on ${PLAT_LONG[x.plats[0]]} or "", "confident": true|false}
Use "" for anything you do not know. Do not invent facts.`;
  try{
    const r=await SAMPLE.json(prompt,{cache:{gcTime:86400000}});
    if(!S.detail) return;
    if(r&&typeof r==="object"){
      const patch={}; ["developer","publisher","genre","summary"].forEach(k=>{ if(r[k]) patch[k]=String(r[k]); });
      // The game may have been renamed: refresh its fields and cover from the current title.
      // The release catalogue wins where it knows the game; Claude's answer fills the rest.
      const nt=norm(x.title); const rel=allReleases();
      const ci=rel.find(q=>q._n===nt && x.plats.some(p=>q.p.includes(p))) || rel.find(q=>q._n===nt) || {};
      const fresh={
        developer: ci.dev||patch.developer||"", publisher: ci.pub||patch.publisher||"", genre: ci.g||patch.genre||"",
        releaseDate: ci.d || (/^\d{4}-\d{2}-\d{2}$/.test(r.releaseDate||"")?r.releaseDate:""),
        coverId: S.info[infoKey(x.title)]?.coverId || ci.c || S.coverMap.get(nt) || "" }; // a cover picked for this title wins over the catalogue's
      await saveInfo(x.title, patch);
      const apply=(c,keys)=>{ let ch=false; keys.forEach(k=>{ if(fresh[k] && c[k]!==fresh[k]){ c[k]=fresh[k]; ch=true; } }); return ch; };
      let newCover=false;
      if(x.g){ const c=JSON.parse(JSON.stringify(x.g)); const before=c.coverId;
        if(apply(c,["developer","publisher","genre","releaseDate","coverId"])) await saveGame(c); newCover=!!fresh.coverId && fresh.coverId!==before; }
      if(x.rent){ const c=JSON.parse(JSON.stringify(x.rent)); const before=c.coverId;
        if(apply(c,["developer","publisher","genre","coverId"])) await saveRent(c); newCover=!!fresh.coverId && fresh.coverId!==before; }
      const coverNote = newCover ? " และเปลี่ยนรูปปกให้ตรงกับชื่อเกมแล้ว" : (!fresh.coverId && (x.g||x.rent) ? " (ยังไม่เจอรูปปกของชื่อนี้ กด “เปลี่ยนรูปปก” เพื่อใส่เองได้)" : "");
      S.detail.aiState = (r.confident===false ? "Claude ไม่แน่ใจข้อมูลบางส่วน" : "อัปเดตข้อมูลแล้ว") + coverNote;
    }
  }catch(e){
    if(!S.detail) return; const c=e&&e.code;
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){ SAMPLE=null; S.detail.aiState=""; }
    else S.detail.aiState = c==="rate_limited"?"ใช้งานถี่เกินไป ลองใหม่ภายหลัง":"ค้นข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง";
  }
  if(S.detail) renderDetail();
}

function shrinkImage(file,maxSide){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ const max=maxSide||720; let w=img.naturalWidth,h=img.naturalHeight; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
      const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",0.85); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("decode")); };
    img.src=url;
  });
}

async function uploadCover(file){
  const x=detailData(); if(!x||!ASSETS) return;
  toast("กำลังอัปโหลดรูปปก…");
  try{
    const blob=await shrinkImage(file);
    const up=await ASSETS.upload(blob,{type:"image/jpeg"});
    await saveInfo(x.title,{coverId:up.id});
    if(x.g){ const c=JSON.parse(JSON.stringify(x.g)); c.coverId=up.id; await saveGame(c); }
    if(x.rent){ await saveRent({...x.rent, coverId:up.id}); }
    toast("บันทึกรูปปกแล้ว"); renderDetail();
  }catch(e){ toast(e&&e.code==="too_large"?"ไฟล์ใหญ่เกินไป":"อัปโหลดรูปไม่สำเร็จ ลองรูปอื่น"); }
}

function openSheet(g, opts={}){
  const base = { id:uid(), title:"", platform:"PS5", status:"owned", developer:"", publisher:"", genre:"", releaseDate:"", purchaseDate:today(), format:"disc", store:"", price:"", notes:"", loans:[] };
  const draft = JSON.parse(JSON.stringify(Object.assign(base, g||{})));
  if(opts.markBought){ draft.status="owned"; if(!draft.purchaseDate) draft.purchaseDate=today(); }
  S.sheet={ draft, isNew:!S.games.some(x=>x.id===draft.id), markBought:!!opts.markBought, loanWho:"", loanOut:today(), aiState:"", options:opts.platformOptions||null };
  S.confirmDelete=false; S.detail=null;
  renderSheet();
  setTimeout(()=>{ if(S.sheet && S.sheet.isNew && !draft.title) $("#f-title")?.focus(); },50);
}
/* Detail sheet paging: the games of the list the sheet was opened from, in screen order */
const NAV_ATTRS=[["detail","gameId"],["reldetail","rel"],["rentdetail","rentId"]];
function detailNavFrom(t){
  const seen=new Set(), list=[];
  $("#app").querySelectorAll("[data-detail],[data-reldetail],[data-rentdetail]").forEach(el=>{
    const a=NAV_ATTRS.find(([k])=>el.dataset[k]); if(!a) return; const key=a[0]+"|"+el.dataset[a[0]];
    if(!seen.has(key)){ seen.add(key); list.push({k:a[0],v:el.dataset[a[0]]}); }
  });
  const a=NAV_ATTRS.find(([k])=>t.dataset[k]); const i=list.findIndex(x=>x.k===a[0]&&x.v===t.dataset[a[0]]);
  return i<0||list.length<2 ? null : {list,i};
}
function detailStep(d){
  const N=S.detailNav; if(!N||!S.detail) return; const i=N.i+d; if(i<0||i>=N.list.length) return;
  N.i=i; const x=N.list[i]; const a=NAV_ATTRS.find(([k])=>k===x.k);
  openDetail({[a[1]]: a[1]==="rel"?relFromAttr(x.v):x.v});
  const c=$("#sheetRoot .sheet .content"); if(c) c.scrollTop=0;
}

(()=>{ let x0=null,y0=0;
  document.addEventListener("touchstart",e=>{ if(!S.detail||!S.detailNav||!e.target.closest("#sheetRoot .sheet")){ x0=null; return; } const p=e.touches[0]; x0=p.clientX; y0=p.clientY; },{passive:true});

function pullForm(){

  const v=id=>{ const el=$("#f-"+id); return el? el.value : undefined; };
  ["title","developer","publisher","genre","releaseDate","purchaseDate","store","notes"].forEach(k=>{ const x=v(k); if(x!==undefined) d[k]=k==="title"?x.trim():x; });
  const p=v("price"); if(p!==undefined) d.price = p===""?"":Number(p);
  if($("#f-loanWho")){ sh.loanWho=$("#f-loanWho").value; sh.loanOut=$("#f-loanOut").value; }
}

/* Consoles a game was released on, from the release database; null when unknown */
function availablePlats(title){
  const n=norm(title); if(!n) return null; const set=new Set();
  for(const r of allReleases()) if(r._n===n) r.p.forEach(x=>set.add(x));
  return set.size ? PLAT_ORDER.filter(x=>set.has(x)) : null;
}
function fitPlatform(){
  const sh=S.sheet; if(!sh) return; const d=sh.draft;
  const av = sh.allPlats ? null : availablePlats(d.title);
  if(av && !av.includes(d.platform)){
    const exact=allReleases().find(r=>r.t.toLowerCase()===String(d.title).trim().toLowerCase() && r.p.some(x=>av.includes(x)));
    d.platform = exact ? exact.p.find(x=>av.includes(x)) : av[0]; if(d.platform==="PS5") delete d.both; }
  return av;
}

function titleOptions(q,plat){
  const n=norm(q); if(n.length<2) return "";
  const out=[], seen=new Set();
  for(const pass of [0,1]){
    for(const r of allReleases()){
      if(out.length>=40) break;
      if(!r._n.includes(n) || seen.has(r.t)) continue;
      const here=r.p.includes(plat);
      if(pass===0 && !here) continue;
      if(pass===1 && (here || (plat!=="NS2" && /switch 2 edition/i.test(r.t)))) continue;
      seen.add(r.t); out.push(r);
    }
  }
  out.sort((a,b)=>(b._n.startsWith(n))-(a._n.startsWith(n)));
  return out.map(r=>`<option value="${esc(r.t)}">`).join("");
}
function applyReleaseMatch(d){
  const items=allReleases(); const t=norm(d.title); if(!t) return false;
  const cands=items.filter(r=>r._n===t); if(!cands.length) return false;
  // Only trust an entry for the same console; never switch the console the user picked.
  const same=cands.find(x=>x.p.includes(d.platform));
  const r=same || cands[0];
  if(same && !d.releaseDate) d.releaseDate=r.d;
  if(same && same.ps4) d.ps4=1; else if(same) delete d.ps4;
  if(same && d.platform!=="PS5" && d.both===undefined && r.p.includes("NS1") && r.p.includes("NS2")) d.both=true;
  if(!d.genre && r.g) d.genre=r.g;
  if(!d.developer && r.dev) d.developer=r.dev;
  if(!d.publisher && r.pub) d.publisher=r.pub;
  return true;
}

async function aiFill(){
  pullForm(); const sh=S.sheet; const d=sh.draft;
  if(!d.title){ toast("พิมพ์ชื่อเกมก่อน"); return; }
  sh.aiState="busy"; renderSheet();
  const prompt = `You are filling a personal video game catalogue. Game title: "${d.title}". Platform: ${PLAT[d.platform].label} (${d.platform==="PS5"?"PlayStation 5":d.platform==="NS2"?"Nintendo Switch 2":"Nintendo Switch"}).
Reply with only a JSON object: {"title": official English title, "developer": string, "publisher": string, "genre": "1-3 genres in English, comma separated, e.g. Action role-playing, Open world", "releaseDate": "YYYY-MM-DD" release date on that platform (worldwide/US) or "" if unknown, "confident": true|false}.
Use "" for anything you are not sure about. Example: {"title":"Elden Ring","developer":"FromSoftware","publisher":"Bandai Namco Entertainment","releaseDate":"2022-02-25","confident":true}`;
  try{
    const r = await SAMPLE.json(prompt, { cache:{gcTime:86400000} });
    if(!S.sheet) return;
    const dd=S.sheet.draft;
    if(r && typeof r==="object"){
      if(r.developer && !dd.developer) dd.developer=String(r.developer);
      if(r.genre && !dd.genre) dd.genre=String(r.genre);
      if(r.publisher && !dd.publisher) dd.publisher=String(r.publisher);
      if(/^\d{4}-\d{2}-\d{2}$/.test(r.releaseDate||"") && !dd.releaseDate) dd.releaseDate=r.releaseDate;
      applyReleaseMatch(dd);
      S.sheet.aiState = r.confident===false ? "Claude ไม่แน่ใจข้อมูลบางส่วน ตรวจทานก่อนบันทึก" : "เติมข้อมูลแล้ว ตรวจทานก่อนบันทึก";
    } else S.sheet.aiState="ไม่พบข้อมูล กรอกเองได้เลย";
  }catch(e){
    if(!S.sheet) return;
    const c=e&&e.code;
    if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled"||c==="capability_removed"){ SAMPLE=null; S.sheet.aiState=""; }
    else S.sheet.aiState = c==="rate_limited" ? "ใช้งานถี่เกินไป ลองใหม่ภายหลัง" : "ค้นข้อมูลไม่สำเร็จ ลองใหม่หรือกรอกเอง";
  }
  renderSheet();
}

/* ---------- import (Notion CSV / JSON backup) ---------- */
function parseCSV(text){
  text=text.replace(/^﻿/,""); const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===","){ row.push(f); f=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c; }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
const FIELD_RULES=[
  ["releaseDate",/release|วางจำหน่าย|วันวาง|วางขาย|ออกวาง/i],
  ["purchaseDate",/purchase|bought|buy date|ซื้อเมื่อ|วันที่ซื้อ|วันซื้อ/i],
  ["returned",/return|คืน/i],
  ["borrower",/borrow|lent|lend|loan|ยืม/i],
  ["developer",/develop|dev\b|ผู้พัฒนา|ผู้ผลิต|ผลิต/i],
  ["publisher",/publish|ผู้จัดจำหน่าย|จัดจำหน่าย/i],
  ["platform",/platform|console|system|เครื่อง|แพลตฟอร์ม/i],
  ["genre",/genre|แนว|ประเภทเกม/i],
  ["format",/format|type|media|แบบ|ประเภท|ช่องทาง/i],
  ["store",/store|shop|ร้าน|ที่ซื้อ/i],
  ["price",/price|cost|ราคา|baht|บาท/i],
  ["status",/status|สถานะ|wish/i],
  ["notes",/note|โน้ต|หมายเหตุ/i],
  ["title",/name|title|game|ชื่อ|เกม/i],
];
function mapHeaders(h){
  const used=new Set(); return h.map(col=>{ const r=FIELD_RULES.find(([f,re])=>!used.has(f)&&re.test(col)); if(r){ used.add(r[0]); return r[0]; } return null; });
}
function toISO(s){
  s=String(s||"").trim(); if(!s) return "";
  s=s.split(/→|->/)[0].trim();
  let m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/); if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/); if(m){ let y=+m[3]; if(y>2400) y-=543; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  const d=new Date(s); if(!isNaN(d)) return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return "";
}
function toPlat(s){ s=String(s||"").toLowerCase(); if(/ps|playstation/.test(s)) return "PS5"; if(/switch\s*2|ns\s*2|switch2/.test(s)) return "NS2"; if(/switch|ns|nintendo/.test(s)) return "NS1"; return "PS5"; }
function truthy(s){ return /^(yes|true|y|✓|✔|1|คืนแล้ว|คืน|checked)$/i.test(String(s||"").trim()); }

async function handleImportFile(file){
  const text=await file.text();
  let games=[], mapping=null;
  if(/\.json$/i.test(file.name) || text.trim().startsWith("{")){
    let j; try{ j=JSON.parse(text); }catch{ toast("อ่านไฟล์ JSON ไม่ได้"); return; }
    if(j && j.kind==="full"){
      const n=o=>Object.keys(o||{}).length;
      S.importPreview={ name:file.name, full:j, games:(j.games||[]).filter(g=>g&&g.title),
        summary:`เกม ${(j.games||[]).length} · เช่า ${(j.rentals||[]).length} · สมาชิก ${(j.subs||[]).length} · ข้อมูลเกม ${n(j.gameinfo)} · ปฏิทิน ${n(j.catalog)} ชุด` };
      render(); return;
    }
    games=(j.games||[]).filter(g=>g&&g.title).map(g=>({...g, id:g.id||uid()}));
  } else {
    const rows=parseCSV(text); if(rows.length<2){ toast("ไม่พบข้อมูลในไฟล์ CSV"); return; }
    const head=rows[0]; const map=mapHeaders(head); mapping=head.map((h,i)=>[h,map[i]&&({title:"ชื่อเกม",platform:"เครื่อง",developer:"ผู้พัฒนา",publisher:"ผู้จัดจำหน่าย",releaseDate:"วันวางจำหน่าย",genre:"แนวเกม",purchaseDate:"วันที่ซื้อ",format:"รูปแบบ",store:"ร้าน",price:"ราคา",borrower:"คนยืม",returned:"คืนแล้ว",status:"สถานะ",notes:"โน้ต"}[map[i]])]);
    if(!map.includes("title")) map[0]="title";
    games=rows.slice(1).map(r=>{
      const o={}; map.forEach((f,i)=>{ if(f) o[f]=(r[i]||"").trim(); });
      if(!o.title) return null;
      const g={ id:uid(), title:o.title, platform:toPlat(o.platform), developer:o.developer||"", publisher:o.publisher||"",
        releaseDate:toISO(o.releaseDate), purchaseDate:toISO(o.purchaseDate),
        format:/digital|download|ดาวน์โหลด|ดิจิ|psn|eshop/i.test(o.format||"")?"digital":"disc",
        store:o.store||"", price:o.price? (Number(String(o.price).replace(/[^\d.]/g,""))||"") : "",
        status:/wish|อยาก/i.test(o.status||"")?"wishlist":"owned", notes:o.notes||"", genre:o.genre||"", loans:[] };
      if(o.borrower && !/^(-|ไม่มี|none|no)$/i.test(o.borrower)){ g.loans=[{ who:o.borrower, out:"", ...(truthy(o.returned)?{back:today()}:{}) }]; }
      return g;
    }).filter(Boolean);
  }
  if(!games.length){ toast("ไม่พบเกมในไฟล์"); return; }
  S.importPreview={ name:file.name, games, mapping }; render();
}
async function doImport(){
  const ip=S.importPreview; if(!ip) return; let n=0;
  const btn=document.querySelector('[data-act="doImport"]'); if(btn){ btn.disabled=true; btn.textContent="กำลังนำเข้า…"; }
  if(ip.full){
    if(S.mode!=="cloud"){ toast("เข้าสู่ระบบก่อนนำเข้า"); return; }
    const j=JSON.parse(JSON.stringify(ip.full)), rows=[];
    // Single cover files stayed in the old app; drop those links so the daily update refills them from IGDB
    const one=c=>/^[0-9a-f]{32}$/.test(String(c||""));
    const fix=o=>{ if(o&&one(o.coverId)) delete o.coverId; };
    (j.games||[]).forEach(fix); (j.rentals||[]).forEach(fix); Object.values(j.gameinfo||{}).forEach(fix);
    Object.values(j.catalog||{}).forEach(d=>(d&&d.items||[]).forEach(x=>{ if(x&&one(x.c)) delete x.c; }));
    ((j.meta&&j.meta.releases&&j.meta.releases.items)||[]).forEach(x=>{ if(x&&one(x.c)) delete x.c; });
    const list=(coll,arr)=>(arr||[]).forEach(x=>{ if(x&&x.id){ const {id,...data}=x; rows.push({coll,id,data}); } });
    const map=(coll,obj)=>Object.entries(obj||{}).forEach(([id,data])=>{ if(data) rows.push({coll,id,data}); });
    list("games",j.games); list("rentals",j.rentals); list("subs",j.subs); map("gameinfo",j.gameinfo); map("catalog",j.catalog);
    if(j.meta&&j.meta.releases) rows.push({coll:"meta",id:"releases",data:j.meta.releases});
    if(j.meta&&j.meta.top10) rows.push({coll:"meta",id:"top10",data:j.meta.top10});
    try{ await DB.bulkSet(rows,(a,b)=>{ if(btn) btn.textContent=`กำลังนำเข้า ${a}/${b}`; }); S.importPreview=null; render(); toast(`นำเข้าครบแล้ว ${rows.length} รายการ`); }
    catch(e){ if(btn){ btn.disabled=false; btn.textContent="ลองนำเข้าอีกครั้ง"; } toast("นำเข้าไม่สำเร็จ: "+(e&&e.message||"")); }
    return;
  }
  for(const g of ip.games){ try{ await saveGame(g); n++; }catch{ break; } }
  S.importPreview=null; render(); toast(`นำเข้าแล้ว ${n} เกม`);
}

  if(S.detail && ds.act==="dAi"){ detailAi(); return; }

  if(ds.return){ t.disabled=true; await markReturned(ds.return); return; }

    case "cancelLoan": pullForm(); { const l=currentLoan(sh.draft); sh.draft.loans=sh.draft.loans.filter(x=>x!==l); } renderSheet(); break;
    case "delete": pullForm(); S.confirmDelete=true; renderSheet(); break;
    case "noDelete": S.confirmDelete=false; renderSheet(); break;
    case "reallyDelete": t.disabled=true; try{ await deleteGame(sh.draft.id); closeSheet(); toast("ลบแล้ว"); }catch(e){ t.disabled=false; toast("ลบไม่สำเร็จ ลองอีกครั้ง"); } break;
  }
});
document.addEventListener("input", e=>{
  if(e.target.id==="libQ"){ S.lib.q=e.target.value; clearTimeout(S._qt); S._qt=setTimeout(render,180); }
  if(e.target.id==="f-title" && S.sheet){ const dl=$("#dl-rel"); if(dl) dl.innerHTML=titleOptions(e.target.value,S.sheet.draft.platform); }
  if(e.target.id==="sf-start" && S.subSheet){ pullSubForm(); const c=$("#subCalc"); if(c) c.innerHTML=subCalcHTML(S.subSheet.draft); }
  if(e.target.id==="rf-title" && S.rentSheet){ const dl=$("#dl-rent"); if(dl) dl.innerHTML=titleOptions(e.target.value,S.rentSheet.draft.platform); }
  if(["rf-start","rf-due","rf-back"].includes(e.target.id) && S.rentSheet){ pullRentForm(); const c=$("#rentCalc"); if(c) c.innerHTML=rentCalcHTML(S.rentSheet.draft); }
  if(e.target.id==="relQ"){ S.rel.q=e.target.value; S.rel.limit=0; clearTimeout(S._qt); S._qt=setTimeout(render,250); }
});
document.addEventListener("change", e=>{
  if(e.target.id==="libSort"){ S.lib.sort=e.target.value; render(); }
  if(e.target.id==="libGenre"){ S.lib.genre=e.target.value; render(); }
  if(e.target.id==="relGenre"){ S.rel.genre=e.target.value; S.rel.limit=0; render(); }
  if(e.target.id==="importFile" && e.target.files[0]){ handleImportFile(e.target.files[0]); }
  if(e.target.id==="coverFile" && e.target.files[0]){ uploadCover(e.target.files[0]); }
  if(e.target.id==="f-purchaseDate" && S.sheet){ S.sheet.draft.purchaseApprox=false; }
  if(e.target.id==="f-title" && S.sheet){ pullForm(); const d=S.sheet.draft; applyReleaseMatch(d);
    ["releaseDate","developer","publisher"].forEach(k=>{ const el=$("#f-"+k); if(el && !el.value && d[k]) el.value=d[k]; });
    const gb=$("#genreBox"); if(gb) gb.innerHTML=genreBoxHTML(d);
    const before=d.platform; const pb=$("#platBox"); const ph=platBoxHTML(); if(pb && pb.innerHTML!==ph) pb.innerHTML=ph;
    if(d.platform!==before){ d.releaseDate=""; applyReleaseMatch(d); const fr=$("#fmtBox"); if(fr) fr.innerHTML=fmtSegHTML(d);
      ["releaseDate","developer","publisher"].forEach(k=>{ const el=$("#f-"+k); if(el && d[k]) el.value=d[k]; }); if(gb) gb.innerHTML=genreBoxHTML(d); } }
});
document.addEventListener("keydown", e=>{ if(S.detail&&S.detailNav&&(e.key==="ArrowLeft"||e.key==="ArrowRight")&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"")){ detailStep(e.key==="ArrowRight"?1:-1); return; } if(e.key==="Escape"){ if($("#lbRoot")?.innerHTML){ closeShot(); return; } if(S.sheet||S.detail||S.subSheet||S.rentSheet) closeSheet(); } });

try{ const hd=document.querySelector("header.top"); const setH=()=>document.documentElement.style.setProperty("--head-h",hd.offsetHeight+"px"); setH(); new ResizeObserver(setH).observe(hd); }catch{}
readHash();
boot();
})();
</script>
</body></html>
